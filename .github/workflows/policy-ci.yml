name: policy-ci

# Lightweight PR policy gate: static feature-module import-boundary lint over
# server/src. The script is pure Node (no workspace dependencies), so no pnpm
# install is needed; this is the same check the upstream PR gate job runs
# before installing dependencies. No DB, browser or network services required.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-ci:
    name: policy-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Feature module boundary check
        run: node scripts/check-module-boundaries.mjs
