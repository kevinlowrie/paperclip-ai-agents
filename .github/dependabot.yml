version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Each dependency update gets its own pull request, including major
    # version bumps. A grouped major PR cannot merge when one member has
    # a blocked upgrade, so it hides the other ready majors. Separate PRs
    # let each major land on its own. The limit holds the initial burst
    # of pending majors plus the regular minor and patch updates.
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
    # Dependabot's npm parser reads only dependencies, devDependencies, and
    # optionalDependencies — never peerDependencies. It cannot see the
    # optional OpenTelemetry peer dependencies in server/package.json, so it
    # never bumps their declared versions. The same limit applies to the
    # optional @sentry/node peer dependency in server/package.json: Dependabot
    # cannot bump it either, for the same reason. @sentry/browser stays a
    # normal devDependency of ui/package.json, so Dependabot does track that
    # one.
    ignore:
      # @types/node describes the APIs available in the supported Node runtime.
      # Runtime major upgrades are deliberate compatibility changes, so keep
      # Dependabot on the current major until the runtime baseline moves too.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    ignore:
      # This first-party workflow follows CODEOWNERS-protected master.
      - dependency-name: "paperclipai/paperclip/.github/workflows/pr-trusted.yml"

  # Added: ecosystems this repo ships that the entries above do not cover.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github"
      - "/docker/daytona-runner"
      - "/docker/hermes-gateway-smoke"
      - "/docker/openclaw-smoke"
      - "/docker/untrusted-review"
      - "/packages/plugins/sandbox-providers/cloudflare/bridge-template"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/packages/paperclip-runner/runner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/tools/agent-shim"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directories:
      - "/packages/plugins/sandbox-providers/cloudflare"
      - "/packages/plugins/sandbox-providers/cloudflare/bridge-template"
      - "/packages/plugins/sandbox-providers/createos"
      - "/packages/plugins/sandbox-providers/daytona"
      - "/packages/plugins/sandbox-providers/e2b"
      - "/packages/plugins/sandbox-providers/exe-dev"
      - "/packages/plugins/sandbox-providers/kubernetes"
      - "/packages/plugins/sandbox-providers/modal"
      - "/packages/plugins/sandbox-providers/novita"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
